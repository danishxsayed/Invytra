<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Geist;src:url(Geist-SemiBold.woff2);font-weight:600}
*{box-sizing:border-box;margin:0}
html,body{width:600px;height:450px;background:transparent;overflow:hidden}
.o{position:absolute;display:flex;align-items:center;justify-content:center}
/* shared glossy look */
.g:before{content:"";position:absolute;inset:0;border-radius:inherit;
 background:linear-gradient(155deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,.12) 32%,rgba(255,255,255,0) 50%);pointer-events:none}
.g:after{content:"";position:absolute;left:12%;right:12%;bottom:6%;height:18%;border-radius:50%;
 background:radial-gradient(closest-side,rgba(214,255,90,.55),transparent);filter:blur(4px);pointer-events:none}
/* LinkedIn tile */
.li{left:70px;top:120px;width:170px;height:170px;border-radius:44px;transform:rotate(-12deg);
 background:linear-gradient(160deg,#3d98ff 0%,#0A66C2 52%,#0a4a8f 100%);
 box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -14px 26px rgba(4,30,70,.45),inset 0 0 0 2px rgba(255,255,255,.12),
  0 40px 60px -22px rgba(30,50,0,.55),0 14px 24px -10px rgba(10,60,140,.6)}
.li b{font:600 92px/1 Geist;color:#fff;letter-spacing:-4px;text-shadow:0 4px 0 rgba(4,40,90,.35),0 10px 18px rgba(0,0,0,.25);position:relative;z-index:1;margin-top:-6px}
/* Envelope */
.env{left:300px;top:40px;width:210px;height:150px;border-radius:30px;transform:rotate(9deg);
 background:linear-gradient(165deg,#ffe28a 0%,#FBBF24 50%,#e09b06 100%);
 box-shadow:inset 0 3px 0 rgba(255,255,255,.7),inset 0 -14px 24px rgba(120,70,0,.35),0 40px 60px -22px rgba(30,50,0,.5),0 14px 24px -10px rgba(170,110,0,.55)}
.env svg{position:absolute;inset:0;width:100%;height:100%}
/* Chat bubble */
.chat{left:300px;top:225px;width:190px;height:170px;transform:rotate(-6deg)}
.bubble{position:absolute;inset:0 0 22px 0;border-radius:60px 60px 60px 60px;
 background:linear-gradient(160deg,#6ff0a0 0%,#25D366 48%,#139a49 100%);
 box-shadow:inset 0 3px 0 rgba(255,255,255,.6),inset 0 -16px 26px rgba(0,70,30,.38),0 40px 60px -22px rgba(30,50,0,.55),0 14px 24px -10px rgba(10,120,50,.55)}
.tail{position:absolute;left:26px;bottom:0;width:58px;height:70px;background:linear-gradient(170deg,#1fb85a,#11893f);
 clip-path:polygon(4% 100%,22% 10%,95% 18%);filter:drop-shadow(0 10px 10px rgba(30,50,0,.3))}
.dots{position:absolute;left:0;right:0;top:0;bottom:22px;display:flex;align-items:center;justify-content:center;gap:16px;z-index:1}
.dots i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e8fff0 60%,#bfeacd);
 box-shadow:0 5px 8px -2px rgba(0,70,30,.45)}
/* lime orbs and sparkles */
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 28%,#f4ffc0,#C4FA13 45%,#86b300 100%);
 box-shadow:inset 0 -6px 10px rgba(70,100,0,.35),0 16px 24px -10px rgba(40,60,0,.55)}
.sp{position:absolute;width:22px;height:22px;background:#fff;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);opacity:.95}
.ring{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.75);box-shadow:0 10px 16px -8px rgba(30,50,0,.4)}
</style></head><body>
<div class="ring" style="left:206px;top:58px;width:64px;height:64px"></div>
<div class="o g li"><b>in</b></div>
<div class="o g env">
 <svg viewBox="0 0 210 150"><path d="M20 32 L105 92 L190 32" fill="none" stroke="rgba(120,70,0,.55)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M20 30 L105 88 L190 30" fill="none" stroke="#fff6d6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<div class="o chat"><div class="tail"></div><div class="bubble g"></div><div class="dots"><i></i><i></i><i></i></div></div>
<div class="orb" style="left:530px;top:200px;width:38px;height:38px"></div>
<div class="orb" style="left:110px;top:330px;width:26px;height:26px"></div>
<div class="orb" style="left:250px;top:330px;width:16px;height:16px"></div>
<div class="sp" style="left:525px;top:60px"></div>
<div class="sp" style="left:40px;top:80px;transform:scale(.7)"></div>
<div class="sp" style="left:520px;top:340px;transform:scale(.55)"></div>
</body></html>
